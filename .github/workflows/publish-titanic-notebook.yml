name: Publish Kaggle Titanic notebook

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-titanic-notebook.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-titanic-notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-titanic-notebook-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public notebook content and code syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          path=Path("ml-lab/kaggle-titanic/titanic_feature_engineering.ipynb")
          nb=json.loads(path.read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4 and len(nb["cells"]) >= 8
          text="\n".join("".join(c.get("source",[])) for c in nb["cells"] if c["cell_type"] == "markdown")
          assert "not an official Kaggle leaderboard score" in text
          assert "/kaggle/input/titanic/train.csv" in json.dumps(nb)
          for cell in nb["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]))
          print("Notebook is valid and self-contained")
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle CLI
        run: python -m pip install "kaggle>=1.7,<2"
      - name: Prepare Kaggle notebook metadata from authenticated account
        shell: bash
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::This account has no Kaggle token configured."
            exit 1
          fi
          mkdir -p /tmp/kaggle/titanic-study
          cp ml-lab/kaggle-titanic/titanic_feature_engineering.ipynb /tmp/kaggle/titanic-study/
          kaggle kernels init -p /tmp/kaggle/titanic-study
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          folder=Path("/tmp/kaggle/titanic-study")
          path=folder/"kernel-metadata.json"
          meta=json.loads(path.read_text(encoding="utf-8"))
          owner=meta.get("id","").split("/")[0]
          if not re.fullmatch(r"[A-Za-z0-9_-]{3,64}", owner) or owner.lower() in {"username","yourname","user"}:
              raise ValueError("Kaggle CLI could not resolve a verified owner from the authenticated account")
          slug="titanic-feature-engineering-cv-study"
          meta.update({
              "id": owner+"/"+slug,
              "title": "Titanic Feature Engineering and CV Study",
              "code_file": "titanic_feature_engineering.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "false",
              "enable_gpu": "false",
              "enable_internet": "false",
              "competition_sources": ["titanic"],
              "dataset_sources": [],
              "kernel_sources": [],
          })
          path.write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print("Prepared public notebook for verified Kaggle account:",owner)
          PY
      - name: Publish notebook (no competition submission)
        shell: bash
        run: |
          kaggle kernels push -p /tmp/kaggle/titanic-study
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path("/tmp/kaggle/titanic-study/kernel-metadata.json").read_text())
          print("PUBLISHED_NOTEBOOK_URL=https://www.kaggle.com/code/"+meta["id"])
          PY
