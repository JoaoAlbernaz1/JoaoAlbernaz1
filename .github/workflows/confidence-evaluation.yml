name: Publish calibrated confidence research model

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/confidence-evaluation.yml"
      - "ml-lab/confidence-evaluation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: confidence-evaluation-research
  cancel-in-progress: false

jobs:
  train-evaluate-publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-lab/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml-lab/requirements.txt
      - name: Validate calibration regression tests
        run: python -m pytest -q ml-lab/confidence-evaluation/tests
      - name: Train on official train and evaluate held-out official test
        run: python ml-lab/confidence-evaluation/confidence.py --output-dir outputs/confidence-evaluation
      - name: Publish measured model to Hugging Face
        if: env.HF_TOKEN != ''
        run: python ml-lab/confidence-evaluation/publish_hf.py
      - name: Publish full measured results on GitHub
        shell: bash
        run: |
          mkdir -p ml-lab/published/confidence-evaluation
          cp outputs/confidence-evaluation/README.md ml-lab/published/confidence-evaluation/README.md
          cp outputs/confidence-evaluation/metrics.json ml-lab/published/confidence-evaluation/metrics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml-lab/published/confidence-evaluation/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(ml): publish measured calibration and risk-coverage results [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
