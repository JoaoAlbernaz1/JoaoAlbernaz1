name: ML lab checks

on:
  push:
    paths:
      - "ml-lab/**"
      - ".github/workflows/ml-lab-ci.yml"
  pull_request:
    paths:
      - "ml-lab/**"
      - ".github/workflows/ml-lab-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ml-lab/requirements.txt"
      - name: Install dependencies
        run: python -m pip install -r ml-lab/requirements.txt
      - name: Run offline tests
        run: python -m pytest -q ml-lab
