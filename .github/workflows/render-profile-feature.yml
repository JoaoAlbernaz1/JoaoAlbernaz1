name: Render profile feature grid

on:
  push:
    branches: [main]
    paths:
      - "assets/feature-grid-chrome.svg"
      - ".github/scripts/render_feature_grid.py"
      - ".github/workflows/render-profile-feature.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Generate GitHub-friendly image assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "CairoSVG>=2.7,<3"
      - name: Render static and animated images
        run: python .github/scripts/render_feature_grid.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/feature-grid-chrome.png assets/feature-grid-chrome.gif
          if git diff --cached --quiet; then
            echo "Generated images unchanged."
            exit 0
          fi
          git commit -m "build(profile): gera GIF e PNG dos cards cromados"
          git push
