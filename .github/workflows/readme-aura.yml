name: Publish chrome profile (readme-aura)

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - '.github/workflows/readme-aura.yml'
      - '.github/scripts/preview_aura.py'
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-aura
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build SVGs and README
        uses: collectioneur/readme-aura@main
        with:
          source: readme.source.md
          output: README.md
          assets_dir: .github/assets
          github_user: JoaoAlbernaz1
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: 'build(profile): render monochrome chrome portfolio'

      - name: Prepare visual QA renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create static preview from generated assets
        run: |
          python -m pip install --disable-pip-version-check "cairosvg>=2.7,<3" "Pillow>=11,<13"
          python .github/scripts/preview_aura.py
      - name: Publish visual QA preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "build(profile): atualiza prévia estática do portfólio"
            git push
          fi
