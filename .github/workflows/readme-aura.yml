name: Build profile README with readme-aura

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - '.github/workflows/readme-aura.yml'
      - '.github/scripts/preview_aura.py'
      - '.github/scripts/generate_aura_backgrounds.py'
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'

permissions:
  contents: write

concurrency:
  group: readme-aura-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate gradient backgrounds for Aura
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python .github/scripts/generate_aura_backgrounds.py
      - name: Render README and SVG components
        uses: collectioneur/readme-aura@main
        with:
          source: readme.source.md
          output: README.md
          assets_dir: .github/assets
          github_user: JoaoAlbernaz1
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: 'build(profile): update readme-aura components'
      - name: Setup Python for visual QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PNG layout preview
        run: |
          python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3" "Pillow>=11,<13"
          python .github/scripts/preview_aura.py
      - name: Commit preview when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "build(profile): refresh preview"
            git push
          fi
