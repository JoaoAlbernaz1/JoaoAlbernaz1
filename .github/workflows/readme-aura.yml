name: Generate profile README — collectioneur style

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - '.github/workflows/readme-aura.yml'
      - 'icons/github-mark.svg'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-readme-aura
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Render animated SVGs and README
        uses: collectioneur/readme-aura@main
        with:
          source: readme.source.md
          output: README.md
          assets_dir: .github/assets
          github_user: JoaoAlbernaz1
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_commit: 'true'
          commit_message: 'build(profile): render collectioneur-style README'
