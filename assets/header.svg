<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#22D3EE" stop-opacity=".40"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .drift1 { animation: d1 14s ease-in-out infinite alternate; }
      .drift2 { animation: d2 18s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(60px, 30px); } }
      @keyframes d2 { to { transform: translate(-70px, -20px); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .spin { transform-origin: 960px 160px; animation: spin 9s linear infinite; }
      .spin2 { transform-origin: 960px 160px; animation: spin 15s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { transform-origin: 960px 160px; animation: pulse 3s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(.3); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation: fade 1.2s .25s ease-out both; }
      .fade3 { animation: fade 1.2s .5s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="drift1" cx="230" cy="40" r="260" fill="url(#g1)"/>
    <circle class="drift2" cx="1050" cy="300" r="280" fill="url(#g2)"/>

    <!-- radar -->
    <g opacity=".9">
      <circle cx="960" cy="160" r="118" fill="none" stroke="#22D3EE" stroke-opacity=".18"/>
      <circle cx="960" cy="160" r="84" fill="none" stroke="#A78BFA" stroke-opacity=".22" stroke-dasharray="4 8"/>
      <circle cx="960" cy="160" r="50" fill="none" stroke="#22D3EE" stroke-opacity=".25"/>
      <circle class="pulse" cx="960" cy="160" r="70" fill="none" stroke="#22D3EE" stroke-opacity=".5"/>
      <g class="spin"><circle cx="1078" cy="160" r="6" fill="#22D3EE"/></g>
      <g class="spin2"><circle cx="876" cy="160" r="5" fill="#A78BFA"/></g>
      <g class="spin"><circle cx="960" cy="110" r="4" fill="#37FF8B"/></g>
      <text x="960" y="170" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" font-weight="700" fill="#E6EDF3">&lt;/&gt;</text>
    </g>

    <g class="fade">
      <text x="72" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#37FF8B">~/brasilia-df $ <tspan fill="#8B949E">whoami</tspan><tspan class="cursor" fill="#37FF8B"> &#9608;</tspan></text>
    </g>
    <g class="fade2">
      <text x="70" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F0F6FC" letter-spacing="-1">João Albernaz</text>
      <text x="72" y="204" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="url(#txt)">Full-stack &amp; Mobile Developer · Automação com IA</text>
    </g>
    <g class="fade3">
      <text x="72" y="250" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#8B949E">Next.js  ·  React Native  ·  NestJS  ·  Supabase  ·  n8n + OpenAI</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#30363D"/>
</svg>
