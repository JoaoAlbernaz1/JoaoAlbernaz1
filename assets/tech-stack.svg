    <g>
      <rect x="534" y="16" width="249" height="218" rx="5" fill="#101318" stroke="#383d44"/>
      <path d="M552 64H765" stroke="#343940"/>
      <text x="552" y="45" fill="#8e98a3" font-size="13" letter-spacing="2.1">03 / MOBILE</text>
      <text x="552" y="105" fill="#f2f4f6" font-size="23" font-weight="700">React Native</text>
      <text x="552" y="136" fill="#ced3d9" font-size="20">Expo</text>
