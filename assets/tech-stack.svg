      <text x="293" y="105" fill="#f2f4f6" font-size="23" font-weight="700">Python</text>
      <text x="293" y="136" fill="#ced3d9" font-size="20">FastAPI · Django</text>
      <text x="293" y="167" fill="#ced3d9" font-size="20">Node.js · NestJS</text>
      <text x="293" y="202" fill="#8d959f" font-size="15">REST APIs</text>
