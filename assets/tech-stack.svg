<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 250" width="1060" height="250" role="img" aria-labelledby="title description">
  <title id="title">Technology stack</title>
  <desc id="description">Four monochrome panels highlighting frontend, backend, mobile, and infrastructure tools.</desc>
  <rect width="1060" height="250" rx="8" fill="#0b0d10"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="16" y="16" width="249" height="218" rx="5" fill="#101318" stroke="#383d44"/>
      <path d="M34 64H247" stroke="#343940"/>
      <text x="34" y="45" fill="#8e98a3" font-size="13" letter-spacing="2.1">01 / FRONTEND</text>
      <text x="34" y="105" fill="#f2f4f6" font-size="23" font-weight="700">React</text>
      <text x="34" y="136" fill="#ced3d9" font-size="20">Next.js</text>
      <text x="34" y="167" fill="#ced3d9" font-size="20">TypeScript</text>
      <text x="34" y="202" fill="#8d959f" font-size="15">Tailwind CSS</text>
    </g>
