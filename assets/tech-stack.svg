      <text x="811" y="105" fill="#f2f4f6" font-size="23" font-weight="700">PostgreSQL</text>
      <text x="811" y="136" fill="#ced3d9" font-size="20">Supabase · Redis</text>
      <text x="811" y="167" fill="#ced3d9" font-size="20">Docker</text>
