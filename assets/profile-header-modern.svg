  <radialGradient id="glow"><stop stop-color="#818cf8" stop-opacity=".28"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#374151" stroke-width=".55" opacity=".42"/></pattern>
</defs>
