<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title desc">
<title id="title">João Albernaz — software engineer</title>
<desc id="desc">Banner escuro moderno com tipografia limpa, detalhes em azul e violeta, engenharia de software, inteligência artificial e automações.</desc>
<defs>
